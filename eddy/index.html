<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>eddy — a loophole</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e8e4da;
    font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated; background: #0f1115; }

  /* top toolbar */
  #toolbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center;
    gap: 8px; padding: 8px 12px; font-size: 13px; background: linear-gradient(#15181dee, #15181d00);
    user-select: none; z-index: 5; }
  #toolbar .title { font-size: 14px; letter-spacing: .5px; opacity: .85; margin-right: 6px; }
  #toolbar .title small { opacity: .45; font-style: italic; }
  .tool { padding: 5px 11px; border: 1px solid #343a44; border-radius: 6px; cursor: pointer;
    color: #e8e4da; background: #1c2026aa; }
  .tool:hover { border-color: #c9772b; }
  .tool.on { border-color: #c9772b; background: rgba(201,119,43,.16); }
  #toolbar .spacer { flex: 1; }
  #toolbar .readout { font-size: 12px; opacity: .55; white-space: nowrap; }

  /* inspector */
  #inspector { position: absolute; right: 12px; bottom: 12px; width: 230px; padding: 12px 14px;
    background: #14171cf2; border: 1px solid #2c2f36; border-radius: 9px; font-size: 12.5px;
    line-height: 1.5; z-index: 5; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #inspector.show { display: block; }
  #inspector h3 { margin: 0 0 1px; font-size: 17px; font-weight: normal; }
  #inspector .meta { opacity: .5; font-size: 11px; margin-bottom: 8px; }
  #inspector .row { margin: 5px 0; }
  #inspector .k { opacity: .5; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-right: 6px; }
  #inspector .why { font-style: italic; opacity: .78; margin-top: 6px; font-size: 11.5px; }
  .chip { display: inline-block; border-radius: 9px; padding: 0 7px; font-size: 11px; color: #10131a;
    font-weight: bold; margin-right: 3px; }
  .chip.lum { background: #ebb446; } .chip.min { background: #6fb0f0; } .chip.hum { background: #7cc878; }

  /* a quiet murmur line, bottom-left */
  #murmur { position: absolute; left: 14px; bottom: 14px; max-width: 42%; font-size: 12.5px;
    font-style: italic; opacity: .4; line-height: 1.5; z-index: 4; pointer-events: none;
    transition: opacity 1.5s; }
  #murmur .by { display: block; opacity: .7; font-style: normal; font-size: 11px; margin-top: 3px; }

  #hint { position: absolute; top: 46px; left: 12px; font-size: 11.5px; opacity: .4; z-index: 4; }
  #chronicle { position: absolute; top: 68px; left: 12px; max-width: 330px; font-size: 12px; z-index: 4;
    line-height: 1.5; pointer-events: none; }
  #chronicle .ev { margin: 2px 0; opacity: .72; }
  #chronicle .born { color: #9fd98f; }
  #chronicle .extinct { color: #d98a8a; opacity: .5; }
  #chronicle .milestone { color: #f0b870; font-style: italic; }
  #chronicle .cascade { color: #e87a5a; font-weight: bold; opacity: .9; }
  #score { position: absolute; top: 42px; right: 12px; z-index: 5; text-align: right; pointer-events: none; }
  #score .aspect { opacity: .55; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; }
  #score .big { font-size: 24px; color: #f0b870; line-height: 1.1; }
  #score .m { opacity: .5; font-size: 11px; margin-top: 2px; }
  #score .m b { color: #e8e4da; opacity: 1; }

  /* the advisor — a quiet counsellor, bottom-right, coloured by urgency */
  #advisor { position: absolute; right: 14px; bottom: 14px; max-width: 38%; font-size: 12.5px;
    text-align: right; line-height: 1.5; z-index: 4; pointer-events: none; opacity: .8; transition: opacity .6s; }
  #advisor .lead { display: block; opacity: .5; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 1.2px; margin-bottom: 2px; }
  #advisor.warn { color: #e8a85a; } #advisor.tip { color: #8fc0e8; } #advisor.good { color: #9fd98f; }

  /* the food web — a compact trophic panel (who eats whom, sized by population), right side below the score */
  #foodweb { position: absolute; top: 140px; right: 12px; width: 178px; z-index: 4; pointer-events: none; opacity: .82; }
  #foodweb .fw-title { opacity: .55; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 5px; }
  #foodweb .fw-row { font-size: 11px; margin: 3px 0; white-space: nowrap; }
  #foodweb .fw-bar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; min-width: 2px; }
  #foodweb .fw-n { color: #e8e4da; } #foodweb .fw-lbl { opacity: .5; font-size: 10px; }
  #foodweb .lum { background: #ebb446; } #foodweb .min { background: #6fb0f0; } #foodweb .hum { background: #7cc878; } #foodweb .red { background: #e0604c; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="toolbar">
      <span class="title">eddy <small>· a loophole</small></span>
      <!-- E.UI populates the tools -->
      <span class="spacer"></span>
      <span class="readout" id="readout"></span>
    </div>
    <div id="hint"></div>
    <div id="score"></div>
    <div id="foodweb"></div>
    <div id="chronicle"></div>
    <div id="murmur"></div>
    <div id="advisor"></div>
    <div id="inspector"></div>
  </div>

  <!-- classic scripts, ordered. sim core first (node-testable), then browser-only layers. -->
  <script src="js/rng.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/field.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/life.js"></script>
  <script src="js/fertility.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/persist.js"></script>
  <script src="js/content.js"></script>
  <script src="js/chronicle.js"></script>
  <script src="js/score.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
