<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialgradient id="b1" cx="50%" cy="55%" r="55%"><stop offset="0%" stop-color="#e8b24a" stop-opacity="0.85"/><stop offset="60%" stop-color="#6a4e1a" stop-opacity="0.3"/><stop offset="100%" stop-color="#0f1115" stop-opacity="0"/></radialgradient>
    <radialgradient id="b2" cx="40%" cy="55%" r="55%"><stop offset="0%" stop-color="#e8b24a" stop-opacity="0.7"/><stop offset="70%" stop-color="#0f1115" stop-opacity="0"/></radialgradient>
    <radialgradient id="b3" cx="60%" cy="55%" r="55%"><stop offset="0%" stop-color="#6fa0e0" stop-opacity="0.6"/><stop offset="70%" stop-color="#0f1115" stop-opacity="0"/></radialgradient>
  </defs>
  <rect width="1040" height="440" fill="#0f1115"/>
  <text x="30" y="42" fill="#e8e4da" font-size="24">the first 60 seconds, redesigned</text>
  <text x="30" y="64" fill="#9a958a" font-size="13" font-style="italic">teach "if i do X, then Y" in 30 seconds — not infer it over 10 minutes. open on life, never a void.</text>

  <!-- panel 1 -->
  <rect x="30" y="86" width="310" height="250" rx="11" fill="#0c0e12" stroke="#23262d"/>
  <ellipse cx="185" cy="205" rx="120" ry="100" fill="url(#b1)"/>
  <ellipse cx="185" cy="205" rx="80" ry="70" fill="none" stroke="#f0b870" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.85"/>
  <g fill="#f4c455"><circle cx="160" cy="190" r="5"/><circle cx="205" cy="220" r="5"/><circle cx="185" cy="240" r="4"/><circle cx="220" cy="185" r="4"/></g>
  <text x="50" y="116" fill="#c9772b" font-size="12" letter-spacing="1.5">0 – 10 s</text>
  <text x="50" y="316" fill="#cfc9bd" font-size="13">a pre-grown patch, already alive.</text>
  <text x="50" y="334" fill="#f0b870" font-size="12.5" font-style="italic">"life takes inside this line. seed here."</text>

  <!-- panel 2 -->
  <rect x="365" y="86" width="310" height="250" rx="11" fill="#0c0e12" stroke="#23262d"/>
  <ellipse cx="470" cy="205" rx="95" ry="90" fill="url(#b2)"/>
  <ellipse cx="585" cy="205" rx="95" ry="90" fill="url(#b3)"/>
  <g fill="#e8e0c8"><circle cx="528" cy="200" r="6"/><circle cx="520" cy="225" r="5"/><circle cx="538" cy="185" r="4"/></g>
  <text x="385" y="116" fill="#c9772b" font-size="12" letter-spacing="1.5">10 – 30 s</text>
  <text x="385" y="306" fill="#cfc9bd" font-size="13">add a second element. where the</text>
  <text x="385" y="324" fill="#cfc9bd" font-size="13">fields overlap, a <tspan fill="#e8e0c8">blend-eater</tspan> arises.</text>
  <text x="528" y="270" fill="#e8e0c8" font-size="11" text-anchor="middle" font-style="italic">↑ the seam</text>

  <!-- panel 3 -->
  <rect x="700" y="86" width="310" height="250" rx="11" fill="#0c0e12" stroke="#23262d"/>
  <ellipse cx="855" cy="205" rx="120" ry="95" fill="url(#b1)"/>
  <g fill="#9fd98f"><circle cx="835" cy="205" r="6"/><circle cx="875" cy="220" r="5"/><circle cx="855" cy="185" r="4"/></g>
  <text x="855" y="135" fill="#8a857a" font-size="9" letter-spacing="1.3" text-anchor="middle">THE WORLD'S TURNS · 1 / 7</text>
  <text x="855" y="158" fill="#f0b870" font-size="18" text-anchor="middle">♻</text>
  <text x="855" y="172" fill="#7a756a" font-size="9" text-anchor="middle">decay</text>
  <text x="720" y="116" fill="#c9772b" font-size="12" letter-spacing="1.5">30 – 60 s</text>
  <text x="720" y="306" fill="#cfc9bd" font-size="13">a turn lights — "a decomposer, born</text>
  <text x="720" y="324" fill="#cfc9bd" font-size="13">from the waste." now you're <tspan fill="#f0b870">playing</tspan>.</text>

  <!-- arrows -->
  <polygon points="352,211 342,205 342,217" fill="#5a5650"/><line x1="340" y1="211" x2="352" y2="211" stroke="#5a5650" stroke-width="2"/>
  <polygon points="687,211 677,205 677,217" fill="#5a5650"/><line x1="675" y1="211" x2="687" y2="211" stroke="#5a5650" stroke-width="2"/>

  <text x="30" y="380" fill="#e8e4da" font-size="14">the loop, taught by playing it: <tspan fill="#9a958a" font-style="italic">place a condition → life answers → a turn is drawn out.</tspan></text>
  <text x="30" y="408" fill="#9a958a" font-size="13">then the sun begins to brighten, and the real game — holding the world against entropy — begins.</text>
</svg>
