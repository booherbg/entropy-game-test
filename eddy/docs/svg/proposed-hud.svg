<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialgradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b24a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7a5a1e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f1115" stop-opacity="0"/>
    </radialgradient>
    <style>.cap{fill:#8a857a;font-size:10px;letter-spacing:1.3px}.n{fill:#10131a;font-size:13px;font-weight:bold}</style>
  </defs>
  <rect width="1040" height="720" fill="#0f1115"/>

  <!-- the world field + a bloom -->
  <circle cx="470" cy="420" r="220" fill="url(#bloom)"/>
  <circle cx="470" cy="420" r="9" fill="#f4c455"/>
  <circle cx="520" cy="380" r="5" fill="#8ec0f0"/><circle cx="430" cy="470" r="5" fill="#7cc878"/>
  <circle cx="500" cy="450" r="6" fill="#e0604c"/><circle cx="445" cy="400" r="4" fill="#e8e0c8"/>

  <text x="30" y="40" fill="#e8e4da" font-size="24">proposed HUD — the legibility + stakes layer</text>
  <text x="30" y="62" fill="#9a958a" font-size="13" font-style="italic">numbered to the roadmap; orange = new</text>

  <!-- (1) the sun / clime deadline gauge -->
  <rect x="300" y="86" width="440" height="34" rx="8" fill="#15181d" stroke="#7a4a1e"/>
  <rect x="312" y="98" width="280" height="10" rx="5" fill="#2a2f37"/>
  <rect x="312" y="98" width="190" height="10" rx="5" fill="#c9772b"/>
  <line x1="690" y1="92" x2="690" y2="114" stroke="#e0604c" stroke-width="2"/>
  <text x="312" y="93" class="cap">THE SUN BRIGHTENS — HOLD IT TEMPERATE</text>
  <text x="700" y="107" fill="#e0604c" font-size="11">cooks</text>
  <circle cx="290" cy="103" r="11" fill="#c9772b"/><text x="290" y="108" class="n" text-anchor="middle">1</text>

  <!-- (2) the turns, labelled -->
  <g font-size="11" text-anchor="middle">
    <text x="470" y="150" fill="#8a857a" font-size="10" letter-spacing="1.3">THE WORLD'S TURNS · 2 / 7</text>
    <g fill="#f0b870"><text x="335" y="178" font-size="17">⚔</text><text x="395" y="178" font-size="17">♻</text></g>
    <g fill="#3b3f47"><text x="455" y="178" font-size="17">☣</text><text x="515" y="178" font-size="17">⚡</text><text x="575" y="178" font-size="17">∞</text><text x="635" y="178" font-size="17">✷</text></g>
    <g fill="#7a756a" font-size="10"><text x="335" y="196">hunt</text><text x="395" y="196">decay</text><text x="455" y="196">rot</text><text x="515" y="196">cascade</text><text x="575" y="196">merge</text><text x="635" y="196">pack</text></g>
  </g>
  <circle cx="678" cy="172" r="11" fill="#c9772b"/><text x="678" y="177" class="n" text-anchor="middle">2</text>

  <!-- (3) status card with par line + delta -->
  <rect x="812" y="86" width="200" height="150" rx="10" fill="#12151b" stroke="#23262d"/>
  <text x="998" y="108" class="cap" text-anchor="end">PURSUING · THE WEAVER</text>
  <text x="998" y="138" fill="#f0b870" font-size="26" text-anchor="end">167 <tspan fill="#7cc878" font-size="14">▲</tspan></text>
  <text x="998" y="160" fill="#7a756a" font-size="11" text-anchor="end">lazy world by now: 121</text>
  <rect x="824" y="170" width="176" height="6" rx="3" fill="#23262d"/>
  <rect x="824" y="170" width="176" height="6" rx="3" fill="#2a2f37"/>
  <rect x="824" y="170" width="122" height="6" rx="3" fill="#c9772b"/>
  <line x1="912" y1="167" x2="912" y2="179" stroke="#7a756a" stroke-width="2"/>
  <text x="998" y="200" fill="#cfc9bd" font-size="11" text-anchor="end">alive 53 · 🌡 0.50</text>
  <text x="998" y="220" fill="#cfc9bd" font-size="11" text-anchor="end">turns drawn out <tspan fill="#f0b870">2/7</tspan></text>
  <circle cx="800" cy="150" r="11" fill="#c9772b"/><text x="800" y="155" class="n" text-anchor="middle">3</text>

  <!-- (4) food web: supply vs demand -->
  <rect x="812" y="250" width="200" height="150" rx="10" fill="#12151b" stroke="#23262d"/>
  <text x="824" y="272" class="cap">THE FOOD WEB · SUPPLY / DEMAND</text>
  <g font-size="10">
    <text x="824" y="300" fill="#8a857a">lumen</text><rect x="876" y="292" width="90" height="8" fill="#ebb446"/><rect x="876" y="292" width="30" height="8" fill="none" stroke="#ebb446" stroke-dasharray="2 2"/>
    <text x="824" y="324" fill="#8a857a">mineral</text><rect x="876" y="316" width="40" height="8" fill="#6fb0f0"/><rect x="876" y="316" width="96" height="8" fill="none" stroke="#6fb0f0" stroke-dasharray="2 2"/>
    <text x="824" y="348" fill="#8a857a">humus</text><rect x="876" y="340" width="20" height="8" fill="#7cc878"/><rect x="876" y="340" width="110" height="8" fill="none" stroke="#7cc878" stroke-dasharray="2 2"/>
    <text x="824" y="372" fill="#7a756a" font-style="italic">dashed = demand unmet</text>
  </g>
  <circle cx="800" cy="300" r="11" fill="#c9772b"/><text x="800" y="305" class="n" text-anchor="middle">4</text>

  <!-- (5) time-series graph, left -->
  <rect x="28" y="250" width="216" height="150" rx="10" fill="#12151b" stroke="#23262d"/>
  <text x="40" y="272" class="cap">THE PULSE · OVER TIME</text>
  <polyline points="40,360 70,350 100,356 130,330 160,338 190,310 232,318" fill="none" stroke="#9fd98f" stroke-width="2"/>
  <polyline points="40,378 70,372 100,380 130,360 160,372 190,352 232,360" fill="none" stroke="#8fc0e8" stroke-width="1.5" opacity="0.8"/>
  <g fill="#e0604c"><rect x="98" y="386" width="2" height="6"/><rect x="158" y="386" width="2" height="6"/><rect x="188" y="386" width="2" height="6"/></g>
  <text x="40" y="396" fill="#7a756a" font-size="9">diversity · clime · | cascades</text>
  <circle cx="232" cy="262" r="11" fill="#c9772b"/><text x="232" y="267" class="n" text-anchor="middle">5</text>

  <!-- (6) surplus contour on the field -->
  <ellipse cx="470" cy="420" rx="150" ry="140" fill="none" stroke="#f0b870" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.8"/>
  <text x="470" y="585" fill="#f0b870" font-size="12" text-anchor="middle" font-style="italic">seed inside the line — life takes here</text>
  <circle cx="618" cy="330" r="11" fill="#c9772b"/><text x="618" y="335" class="n" text-anchor="middle">6</text>

  <!-- (7) lens legend -->
  <rect x="28" y="430" width="216" height="78" rx="10" fill="#12151b" stroke="#23262d"/>
  <text x="40" y="452" class="cap">READING THE FIELD</text>
  <circle cx="48" cy="470" r="6" fill="#ebb446"/><text x="62" y="474" fill="#cfc9bd" font-size="11">lumen · energy</text>
  <circle cx="48" cy="490" r="6" fill="#6fb0f0"/><text x="62" y="494" fill="#cfc9bd" font-size="11">mineral · structure</text>
  <circle cx="150" cy="470" r="6" fill="#7cc878"/><text x="164" y="474" fill="#cfc9bd" font-size="11">humus · decay</text>
  <text x="150" y="494" fill="#7a756a" font-size="10" font-style="italic">lens = same colours</text>
  <circle cx="232" cy="442" r="11" fill="#c9772b"/><text x="232" y="447" class="n" text-anchor="middle">7</text>

  <!-- (8) event toast bound to location -->
  <line x1="500" y1="450" x2="610" y2="510" stroke="#e0604c" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="600" y="500" width="210" height="34" rx="7" fill="#1c1410" stroke="#e0604c"/>
  <text x="612" y="521" fill="#e8a85a" font-size="12">▼ 9 fell — lumen guild overgrazed</text>
  <circle cx="826" cy="517" r="11" fill="#c9772b"/><text x="826" y="522" class="n" text-anchor="middle">8</text>

  <!-- (9) advisor: imperative + location -->
  <rect x="600" y="640" width="412" height="48" rx="10" fill="#12151b" stroke="#2c5566"/>
  <text x="612" y="662" class="cap" fill="#8fc0e8">THE ADVISOR</text>
  <text x="612" y="681" fill="#cfc9bd" font-size="13">seed humus at the north seam — an unworked surplus is pooling ↑</text>
  <circle cx="588" cy="664" r="11" fill="#c9772b"/><text x="588" y="669" class="n" text-anchor="middle">9</text>

  <!-- key -->
  <text x="28" y="640" fill="#8a857a" font-size="11">KEY</text>
  <text x="28" y="660" fill="#9a958a" font-size="11">1 deadline · 2 labelled turns · 3 par line</text>
  <text x="28" y="676" fill="#9a958a" font-size="11">4 demand · 5 graphs · 6 contour · 7 legend</text>
  <text x="28" y="692" fill="#9a958a" font-size="11">8 cause→effect toast · 9 advisor with a place</text>
</svg>
